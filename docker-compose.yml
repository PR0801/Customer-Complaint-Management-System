services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aivoa
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: aivoa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivoa -d aivoa"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aivoa:aivoa@db:5432/aivoa
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-gemma2-9b-it}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  pgdata:
